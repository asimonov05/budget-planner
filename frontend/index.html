<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <link rel="stylesheet" href="/contour.css" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('contour-theme') ?? localStorage.getItem('budget-planner-theme')
          const preference = ['light', 'dark', 'system'].includes(saved) ? saved : 'system'
          const savedColorScheme = localStorage.getItem('contour-color-scheme') ?? localStorage.getItem('budget-planner-color-scheme')
          const colorScheme = ['contour', 'forest', 'ocean', 'plum', 'amber'].includes(savedColorScheme)
            ? savedColorScheme
            : 'contour'
          const savedFont = localStorage.getItem('contour-font') ?? localStorage.getItem('budget-planner-font-v2')
          document.documentElement.dataset.font = ['system', 'classic', 'golos', 'humanist', 'book'].includes(savedFont)
            ? savedFont
            : 'system'
          const systemDark = typeof matchMedia === 'function'
            && matchMedia('(prefers-color-scheme: dark)').matches
          const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.colorScheme = colorScheme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'dark' ? '#111114' : '#f5f5f7',
          )
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.colorScheme = 'contour'
          document.documentElement.dataset.font = 'system'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <title>cap space — личный бюджет</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
