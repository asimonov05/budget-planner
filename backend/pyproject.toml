[project]
name = "budget-planner-backend"
version = "0.1.3"
description = "Self-hosted personal budget planner API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Babel==2.18.0",
    "fastapi==0.139.0",
    "starlette==0.50.0",
    "uvicorn[standard]==0.35.0",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "pydantic==2.11.7",
    "python-multipart==0.0.20",
    "argon2-cffi==25.1.0",
    "sqladmin[full]==0.32.0",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "hypothesis==6.138.15",
    "ruff==0.12.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
